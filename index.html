<!doctype html>
<html lang="en" class="fonts-pending">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Status Rodeo</title>
    <meta name="description" content="Short statuses from a small herd of friends. Read the latest from everyone, or follow along by RSS." />
    <meta name="theme-color" content="#f5dab3" />
    <!-- Default link preview (the home page, and any page without its own). A status page and a
         profile page replace this set with their own in the Cloudflare functions
         (src/status-page.js, src/user-page.js), which remove every og:* and twitter:card tag. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Status Rodeo" />
    <meta property="og:title" content="Status Rodeo" />
    <meta property="og:description" content="Short statuses from a small herd of friends. Read the latest from everyone, or follow along by RSS." />
    <meta property="og:url" content="https://status.rodeo/" />
    <meta property="og:image" content="https://status.rodeo/avatars/icons/sheriff-star.webp" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="A sheriff's star" />
    <meta name="twitter:card" content="summary" />
    <link rel="alternate" type="application/rss+xml" title="Status Rodeo" href="/feed.xml" />
    <link rel="preload" href="/fonts/zilla-slab-bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/nunito-variable.woff" as="font" type="font/woff" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <!-- Shown only while the page is held back for fonts and sign-in (html.fonts-pending), and
         only after a short delay, so fast loads never see it. See "Nothing jumps while loading". -->
    <div id="boot" role="status">
      <svg class="boot-star" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><polygon points="12.00,1.00 14.70,8.28 22.46,8.60 16.37,13.42 18.47,20.90 12.00,16.60 5.53,20.90 7.63,13.42 1.54,8.60 9.30,8.28" /></svg>
      <span class="visually-hidden">Loading Status Rodeo…</span>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
